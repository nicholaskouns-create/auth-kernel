name: Publish FlowShield Pages
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'docs/**'
      - '.github/workflows/publish-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: flowshield-pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify page and scripts
        run: |
          test -s index.html
          test -s docs/flowshield-v2.js
          test -s docs/flowshield-engine.js
          node tests/flowshield-v2.test.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
